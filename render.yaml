# Render Blueprint (Infrastructure as Code) for the Voltx backend API.
#
# Deploy model: .github/workflows/deploy.yml builds the backend's production
# image, pushes it to GHCR, and then tells Render to deploy that exact image.
# `autoDeploy: false` keeps deploys strictly CI-triggered rather than firing
# on every push.
#
# MIGRATIONS — how this changed, and why
#
# This file previously stated that a Render Pre-Deploy Command could not run
# migrations, because the pruned production image did not contain the Prisma
# CLI. That was true then and is no longer true: `prisma` is now a runtime
# dependency (backend/package.json), so it survives `pnpm prune --prod`, and
# backend/Dockerfile fails the build if it is ever missing again.
#
# Delegating migrations to deploy.yml turned out to be the reason production
# ran on an unmigrated database. That job's migrate step failed on every one
# of its runs with P1012 — `DATABASE_URL resolved to an empty string`, because
# the GitHub Environment it targets has no secrets set. Migrations therefore
# never ran even once, and the app booted against an empty schema and threw
# Prisma P2021.
#
# `preDeployCommand` removes that dependency on CI secrets. It runs inside the
# image being deployed, against the live database, BEFORE traffic shifts to the
# new version. A non-zero exit aborts the deploy and the previous version keeps
# serving. `prisma migrate deploy` only applies pending migrations in filename
# order and records them in _prisma_migrations — it never generates, resets or
# invents schema, and aborts on a checksum mismatch.
#
# Owner action required to activate:
#   1. In the Render dashboard: New -> Blueprint -> connect this repo. Render
#      will read this file and create the service below. NOTE: Render only
#      reads render.yaml for services created from (or synced to) a Blueprint —
#      a manually-created service ignores this file entirely.
#   2. If the GHCR package is private, add registry credentials for
#      ghcr.io on the service (Render dashboard -> service -> Settings ->
#      Docker Registry Credentials).
#   3. Fill in every envVar marked `sync: false` below with real values
#      (see backend/.env.example for what each one does).
#   4. Add DATABASE_URL (Neon pooled connection string) and DIRECT_URL
#      (Neon direct/unpooled connection string) as Render env vars — both
#      come from the Neon dashboard for the target database. DIRECT_URL is
#      NOT optional: the migration engine cannot run through Neon's
#      transaction-mode pooler, so preDeployCommand fails without it.
#   5. Add RENDER_API_KEY and RENDER_SERVICE_ID as GitHub Actions secrets so
#      deploy.yml's final Render-deploy step can trigger the deploy.
#   6. Point api.usevoltx.com's DNS at the Render service (Render dashboard
#      -> service -> Settings -> Custom Domains gives the exact CNAME/A
#      record to add at your DNS registrar).

services:
  - type: web
    name: voltx-backend
    runtime: image
    image:
      url: ghcr.io/kingabbey12/voltx-platform/backend:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: false

    # Applies pending migrations before the new version receives traffic.
    # Supported on paid instance types for image-backed services (this is
    # `plan: starter`); not available on free instances. Requires the Prisma
    # CLI inside the image — see the MIGRATIONS note above.
    preDeployCommand: node_modules/.bin/prisma migrate deploy

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      # Comma-separated allow-list (configuration.ts splits on ','). An origin
      # that is not listed gets a 204 preflight with NO Access-Control-Allow-
      # Origin header, so the browser blocks the request and the app reports it
      # as "Can't reach Voltx right now" — indistinguishable from the API being
      # down. The web app is deployed on Vercel; app.usevoltx.com does not
      # currently resolve, and is kept here for when it does.
      #
      # Vercel preview deployments get a unique hostname per deploy and are NOT
      # covered by this list — only the production alias below is.
      - key: CORS_ALLOWED_ORIGINS
        value: https://voltx-platform.vercel.app,https://app.usevoltx.com
      - key: DATABASE_URL
        sync: false
      # Read only by the migration engine. preDeployCommand fails without it
      # on Neon, because migrations cannot run over the pooled endpoint.
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: INTEGRATIONS_ENCRYPTION_KEY
        generateValue: true
      # NOT optional in production. main.ts calls
      # MetricsScrapeGuard.assertConfigured, which throws at boot when this is
      # unset or shorter than 32 characters — /metrics would otherwise be open
      # to anyone who can reach the port. Render's generated value satisfies
      # both conditions.
      - key: METRICS_AUTH_TOKEN
        generateValue: true
      # NOT optional in production. src/bootstrap/redis-requirement.check.ts
      # refuses to boot with NODE_ENV=production unless REDIS_ENABLED=true —
      # comms AI processing, attachment processing, and agent-run resume all
      # need a real queue. Point REDIS_URL at a managed Redis (e.g. Upstash's
      # rediss:// URL, from the Upstash console).
      - key: REDIS_ENABLED
        value: 'true'
      - key: REDIS_URL
        sync: false
      # NOT optional in production. storage.module.ts refuses local-disk
      # attachment storage in production (files would vanish on every
      # container restart). Fill the S3 credentials for the real bucket
      # (any S3-compatible store works; set ATTACHMENTS_S3_ENDPOINT +
      # ATTACHMENTS_S3_FORCE_PATH_STYLE=true for non-AWS providers).
      - key: ATTACHMENTS_STORAGE_PROVIDER
        value: s3
      - key: ATTACHMENTS_S3_BUCKET
        sync: false
      - key: ATTACHMENTS_S3_REGION
        sync: false
      - key: ATTACHMENTS_S3_ENDPOINT
        sync: false
      - key: ATTACHMENTS_S3_FORCE_PATH_STYLE
        sync: false
      - key: ATTACHMENTS_S3_ACCESS_KEY_ID
        sync: false
      - key: ATTACHMENTS_S3_SECRET_ACCESS_KEY
        sync: false
      # Required for file uploads to function (not for boot): in production
      # the upload endpoints return 503 until a reachable ClamAV daemon is
      # configured (attachment.service.ts assertUploadsAvailable). Point
      # these at a clamd instance — e.g. a Render private service running
      # clamav/clamav-debian.
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: '3310'
      # AI providers. Optional at *boot*, but not optional for the AI
      # features: model-registry.service.ts throws
      # ServiceUnavailableException('No AI providers are enabled') when no
      # provider is configured, and agent.service.ts calls it while creating
      # an agent (to pin provider+model on the record). So with none of these
      # set, POST /api/v1/ai/agents returns 503 and no agent can ever be
      # created — the failure is a hard stop, not graceful degradation.
      # Verified against this release: 503 "No AI providers are enabled".
      #
      # Set at least one provider: its *_ENABLED flag AND its key. The flag
      # alone does nothing without the key, and the key alone does nothing
      # without the flag (see config/configuration.ts).
      - key: ANTHROPIC_ENABLED
        value: 'true'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_ENABLED
        value: 'false'
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_ENABLED
        value: 'false'
      - key: GOOGLE_AI_API_KEY
        sync: false

      # Google OAuth — required for the Inbox/Gmail integration to connect at
      # all. integrations.providers.google reads these; without them the
      # consent flow cannot be initiated. Register both redirect URIs on the
      # Google client:
      #   https://app.usevoltx.com/integrations/callback
      #   https://app.usevoltx.com/settings/communications/callback
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      # Remaining variables in backend/.env.example (Stripe keys, error
      # reporting, other OAuth providers) genuinely are optional — each
      # degrades to a disabled feature rather than a 5xx. Add them in the
      # Render dashboard as you need them.
