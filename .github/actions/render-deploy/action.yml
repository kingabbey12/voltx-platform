name: Deploy to Render
description: >-
  Points a Render image-backed service at a freshly built, migrated image and
  triggers a deploy of it. Extracted from deploy.yml so staging and production
  share one implementation rather than two copies that drift apart.

inputs:
  environment:
    description: Environment name, used only in log output.
    required: true
  image:
    description: Fully qualified image reference to deploy (repo:tag).
    required: true
  api-key:
    description: Render API key (Account Settings -> API Keys).
    required: false
    default: ''
  service-id:
    description: Render service ID of the image-backed service to deploy.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Trigger Render deploy
      shell: bash
      env:
        RENDER_API_KEY: ${{ inputs.api-key }}
        RENDER_SERVICE_ID: ${{ inputs.service-id }}
        IMAGE: ${{ inputs.image }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail

        # Warn rather than fail when the service isn't wired up yet: the image
        # has still been built, pushed and migrated, and failing here would
        # block a pipeline that has otherwise done everything correctly.
        if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
          echo "::warning::Skipping Render deploy — RENDER_API_KEY and/or RENDER_SERVICE_ID" \
            "are not set as secrets on the '${ENVIRONMENT}' GitHub environment."
          echo "The image was built, pushed, and migrated successfully:"
          echo "  ${IMAGE}"
          echo "Owner action required: in the Render dashboard, create the voltx-backend"
          echo "service from render.yaml (Blueprint), then add its Service ID and an API"
          echo "key (Account Settings -> API Keys) as RENDER_SERVICE_ID/RENDER_API_KEY"
          echo "secrets on this repo's '${ENVIRONMENT}' GitHub environment. Once set,"
          echo "re-run this workflow (workflow_dispatch) to deploy ${IMAGE}."
          exit 0
        fi

        # Point the Render service at this run's freshly-built, migrated image,
        # then trigger a deploy of it. Two calls because Render's image-backed
        # services store the image reference on the service resource itself;
        # verify this against Render's current API docs (api-docs.render.com)
        # if it starts returning errors — their API has changed shape before.
        curl --fail --silent --show-error \
          -X PATCH "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "{\"imageUrl\": \"${IMAGE}\"}"

        curl --fail --silent --show-error \
          -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{}'

        echo "Deploy triggered on Render for ${IMAGE} (${ENVIRONMENT})."
