name: CI

# Must cover the branches work actually happens on. Restricting this to `main`
# meant no ordinary change was gated: development lands on `develop` and PRs
# target `release/**`, so lint, types, 1338 unit tests, 339 e2e tests, Trivy and
# the dependency audit all ran on nothing. Adding a branch here is cheap; leaving
# one out silently disables every quality control in this repository.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.4"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: voltx
          POSTGRES_USER: voltx
          POSTGRES_PASSWORD: voltx
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: backend

      - run: pnpm lint
        working-directory: backend

      - run: npx tsc --noEmit
        working-directory: backend

      - run: pnpm test
        working-directory: backend

      # .env.test is the single, complete test environment (NODE_ENV=test loads
      # it and nothing else), so CI no longer shuffles env files into place
      # before running e2e — it runs exactly what a developer runs locally.
      # DATABASE_URL is the one override, pointing at the service container.
      - name: Prepare e2e database
        run: npx prisma migrate deploy && pnpm prisma:seed:billing-plans
        working-directory: backend
        env:
          DATABASE_URL: postgresql://voltx:voltx@localhost:5433/voltx

      - run: pnpm test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://voltx:voltx@localhost:5433/voltx

      - run: pnpm build
        working-directory: backend

      # Blocking. The dependency tree is currently clean at every severity, so
      # this fails only on a genuinely new advisory. Fix it by pinning the
      # patched version in backend/pnpm-workspace.yaml `overrides`; if a fix is
      # genuinely unavailable, that is a decision to record explicitly rather
      # than absorb by making this step advisory again.
      - run: pnpm audit --audit-level=high
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - run: pnpm lint
        working-directory: apps/web

      - run: npx tsc --noEmit
        working-directory: apps/web

      - run: pnpm build
        working-directory: apps/web

      # Blocking, same contract as the backend step — pin patched versions in
      # apps/web/pnpm-workspace.yaml `overrides` rather than reverting this.
      - run: pnpm audit --audit-level=high
        working-directory: apps/web

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: apps/web

      - name: Run Playwright tests
        run: pnpm test:e2e
        working-directory: apps/web
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: apps/web/test-results/
          retention-days: 7

  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build macos --config-only --release
        working-directory: apps/mobile
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest,ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest,ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
