name: CI

# Must cover the branches work actually happens on. Restricting this to `main`
# meant no ordinary change was gated: development lands on `develop` and PRs
# target `release/**`, so lint, types, the unit and e2e suites, Trivy and the
# dependency audit all ran on nothing. Adding a branch here is cheap; leaving
# one out silently disables every quality control in this repository.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.4"

jobs:
  backend:
    name: Backend (lint, types, test, e2e, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Database name must match backend/.env.test's DATABASE_URL — that
        # file is committed and drives the e2e run.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: voltx_test
          POSTGRES_USER: voltx
          POSTGRES_PASSWORD: voltx
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U voltx -d voltx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: backend

      - run: pnpm lint
        working-directory: backend

      - run: npx tsc --noEmit
        working-directory: backend

      - run: pnpm test
        working-directory: backend

      # backend/.env.test is committed and is the single, complete test
      # environment (NODE_ENV=test loads it and nothing else), so CI no longer
      # materializes it — it runs exactly what a developer runs locally.
      #
      # The Prisma CLI reads .env, not .env.test, so the migration step needs
      # these passed explicitly. DIRECT_URL is not optional: schema.prisma
      # declares `directUrl = env("DIRECT_URL")` for Neon's pooled endpoint,
      # and the migration engine fails without it. Both must name the same
      # database as backend/.env.test, or e2e migrates one database and then
      # runs against another.
      - name: Prepare e2e database
        run: npx prisma migrate deploy && pnpm prisma:seed:billing-plans
        working-directory: backend
        env:
          DATABASE_URL: postgresql://voltx:voltx@localhost:5433/voltx_test
          DIRECT_URL: postgresql://voltx:voltx@localhost:5433/voltx_test

      - run: pnpm test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://voltx:voltx@localhost:5433/voltx_test
          DIRECT_URL: postgresql://voltx:voltx@localhost:5433/voltx_test

      - run: pnpm build
        working-directory: backend

      # Blocking. The dependency tree is currently clean at every severity, so
      # this fails only on a genuinely new advisory. Fix it by pinning the
      # patched version in backend/pnpm-workspace.yaml `overrides`; if a fix is
      # genuinely unavailable, that is a decision to record explicitly rather
      # than absorb by making this step advisory again.
      - run: pnpm audit --audit-level=high
        working-directory: backend

  web:
    name: Web (lint, types, build, e2e)
    runs-on: ubuntu-latest
    # Declared once for the whole job rather than per step. Two separate steps
    # start a Next server — `pnpm build`, and `pnpm test:e2e` via Playwright's
    # `webServer: { command: "pnpm dev" }` — and both run scripts/validate-env.mjs
    # from their prestart hook, which throws when this is unset. Setting it only
    # on the build step (as before) left Playwright's server to die on boot with
    # "NEXT_PUBLIC_API_BASE_URL is missing", which Playwright reports as the
    # opaque "Process from config.webServer was not able to start".
    #
    # CI never calls the API: the value only has to satisfy validate-env.mjs and
    # src/config/env.ts's build-time shape check (absolute URL, no
    # /auth|/login|/health path segment). It is inlined into the client bundle,
    # so it must never be a real production URL here.
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.ci.usevoltx.example/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - run: pnpm lint
        working-directory: apps/web

      - run: npx tsc --noEmit
        working-directory: apps/web

      - run: pnpm build
        working-directory: apps/web

      # Blocking, same contract as the backend step — pin patched versions in
      # apps/web/pnpm-workspace.yaml `overrides` rather than reverting this.
      - run: pnpm audit --audit-level=high
        working-directory: apps/web

      - name: Install Playwright
        # --with-deps installs the system libraries headless Chromium needs;
        # without them the browser launches and immediately crashes.
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright tests
        run: pnpm test:e2e
        working-directory: apps/web
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: apps/web/test-results/
          retention-days: 7

  # The 23 specs under apps/web/e2e/authenticated/ drive routes behind
  # src/app/(app)/layout.tsx, which resolves its user from the API and redirects
  # to /login when it cannot. They therefore need a real backend and a real
  # login, which the fast `web` job deliberately does not stand up — keeping
  # lint/types/build/audit feedback quick. Split out rather than deleted or
  # skipped: before this job existed they ran against a login page and either
  # failed or passed vacuously.
  web-e2e-authenticated:
    name: Web e2e (authenticated)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: voltx_e2e
          POSTGRES_USER: voltx
          POSTGRES_PASSWORD: voltx
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U voltx -d voltx_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://voltx:voltx@localhost:5433/voltx_e2e
      DIRECT_URL: postgresql://voltx:voltx@localhost:5433/voltx_e2e
      # The API serves on 3000, so the Next server under test takes 3001.
      # playwright.config.ts derives both its webServer port and its baseURL
      # from PLAYWRIGHT_PORT, so this single value keeps them in step.
      PLAYWRIGHT_PORT: "3001"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      E2E_USER_EMAIL: e2e-runner@ci.usevoltx.example
      E2E_USER_PASSWORD: e2e-Runner-Password-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the API
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Migrate and seed
        working-directory: backend
        # The RBAC catalogue must exist before registration: /auth/register
        # assigns the new user the Owner role, which prisma:seed creates.
        run: |
          npx prisma migrate deploy
          pnpm prisma:seed

      - name: Start the API
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: "3000"
          REDIS_ENABLED: "false"
          JWT_ACCESS_SECRET: ci-e2e-jwt-access-secret-at-least-32-chars
          INTEGRATIONS_ENCRYPTION_KEY: ci-e2e-integrations-encryption-key
          DATABASE_SEED_ON_BOOTSTRAP: "false"
          # Must match the origin the Next server is served from. An empty
          # value trusts no browser origin at all, which makes the CORS
          # preflight for POST /auth/login return 404 — the login silently
          # never happens and every authenticated spec fails on a redirect to
          # /login with nothing in the API log to explain it.
          CORS_ALLOWED_ORIGINS: http://localhost:3001
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/readiness > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready:"; cat /tmp/api.log; exit 1

      - name: Create the e2e user
        # Uses the real registration endpoint rather than a bespoke seed script,
        # so the account is built the same way a customer's would be.
        run: |
          code=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${E2E_USER_EMAIL}\",\"password\":\"${E2E_USER_PASSWORD}\",\"firstName\":\"E2E\",\"lastName\":\"Runner\",\"organizationName\":\"E2E Workspace\"}")
          if [ "$code" != "201" ]; then
            echo "Registration failed with HTTP $code:"; cat /tmp/register.json; exit 1
          fi
          echo "e2e user created"

          # A freshly registered account is dropped into the 5-step onboarding
          # wizard, and the app routes redirect there until it is finished — so
          # without this the specs assert against "Tell us about your business"
          # instead of the feature they name. The endpoint is idempotent.
          TOKEN=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/register.json','utf8')).data.accessToken")
          ORG=$(node -pe "JSON.parse(Buffer.from('$TOKEN'.split('.')[1],'base64url').toString()).org")
          code=$(curl -sS -o /tmp/onboarding.json -w '%{http_code}' \
            -X POST "http://localhost:3000/api/v1/organizations/${ORG}/complete-onboarding" \
            -H "Authorization: Bearer ${TOKEN}")
          if [ "$code" != "201" ]; then
            echo "Completing onboarding failed with HTTP $code:"; cat /tmp/onboarding.json; exit 1
          fi
          echo "onboarding completed for org ${ORG}"

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Playwright tests
        working-directory: apps/web
        run: pnpm test:e2e:authenticated
        env:
          CI: true

      - name: Dump API log on failure
        if: failure()
        run: tail -100 /tmp/api.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-authenticated-results
          path: apps/web/test-results/
          retention-days: 7

  # apps/marketing uses npm (not pnpm) and has its own lockfile, matching how
  # it is deployed.
  marketing:
    name: Marketing (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  mobile:
    name: Mobile (analyze, test, build macos)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS (release, production flavor)
        # -t lib/main_production.dart is required: the default lib/main.dart
        # entrypoint resolves its API URL via --dart-define at runtime and
        # falls back to localhost when that's unset, so building it here
        # would never actually validate what a real release build ships.
        # main_production.dart hardcodes the production environment instead.
        #
        # XCODE_XCCONFIG_FILE layers macos/CI.xcconfig over the project's own
        # settings to skip code signing, which a hosted runner has no
        # certificate or provisioning profile for. The compile and link of the
        # Dart, the plugins and the native Runner target are unaffected — see
        # that file for why this does not weaken the check.
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/apps/mobile/macos/CI.xcconfig
        run: flutter build macos --release -t lib/main_production.dart

  sdk-typescript:
    name: SDK TypeScript (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        # No lockfile is committed for this package — npm install, not npm ci.
        run: npm install

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  cli:
    name: CLI (lint, build, test)
    runs-on: ubuntu-latest
    needs: sdk-typescript
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the local @voltx/sdk dependency
        # packages/cli depends on @voltx/sdk via a `file:../sdk-typescript`
        # reference, resolved as a symlink by npm install below — the
        # target directory needs its dist/ already built before that.
        working-directory: packages/sdk-typescript
        run: |
          npm install
          npm run build

      - name: Install dependencies
        run: npm install

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  sdk-python:
    name: SDK Python (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

  sdk-flutter:
    name: SDK Flutter (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  security:
    name: Security (Trivy)
    runs-on: ubuntu-latest
    # Uploading SARIF writes to the code-scanning API. Without this the upload
    # step dies with "Resource not accessible by integration", because the
    # default GITHUB_TOKEN for a push event is read-only on that endpoint.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to a release, not @master. The floating tag shipped a setup step
      # whose `path` input rejects its own default, so every run failed before
      # Trivy itself ever executed ("The 'path' input must be a literal path").
      # A security gate that breaks on someone else's push is not a gate.
      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
        # Report-only: this step's job is to produce the SARIF. Letting it fail
        # here would skip the upload and lose the findings entirely. The gate
        # below is what actually blocks the build.
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # The blocking gate. Reuses the vulnerability DB the step above cached,
      # so this is a re-scan of already-downloaded data, not a second download.
      # Findings must be fixed by upgrading, or by pinning a patched version in
      # the relevant pnpm-workspace.yaml `overrides` — never by relaxing this.
      - name: Trivy scan (blocking gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    name: Docker (build & publish)
    runs-on: ubuntu-latest
    needs: [backend, web]
    if: github.ref == 'refs/heads/main'
    # Pushing to GHCR needs an explicitly writable token. Without this the
    # images build fine and then the push is rejected with
    # "denied: installation not allowed to Write organization package" —
    # which reads like a registry permissions problem on the account rather
    # than a missing declaration in this file. deploy.yml already grants it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest,ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          # Required: the API URL is compiled into the client bundle. The
          # published image is therefore environment-specific — this one is
          # built for production and must not be reused for another
          # environment. See docs/operations/web-deployment.md.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: ghcr.io/${{ github.repository }}/web:latest,ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
